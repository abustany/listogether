name: CI

on:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      actions: write
      attestations: write
      contents: read
      id-token: write
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}

    # the steps before nix is installed are all "uses:" steps, which ignore this
    defaults:
      run:
        shell: nix develop --command bash --noprofile --norc -eo pipefail {0}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'pnpm-lock.yaml', 'server/Cargo.lock', 'server/rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            server/target
          key: deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'server/Cargo.lock', 'server/rust-toolchain.toml') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # rust-embed fails to compile the server if ui/dist does not exist. Debug
      # builds read the files at runtime, so an empty directory is enough.
      - name: Create ui/dist
        run: mkdir -p ui/dist

      - name: Lint and check formatting
        run: pnpm -r check

      - name: Typecheck
        run: pnpm -r typecheck

      # --no-link: an untracked result symlink makes the flake dirty, which
      # changes the version
      - name: Build docker image
        id: image
        run: |
          echo "path=$(nix build --no-link --print-out-paths -L .#packages.x86_64-linux.docker)" >> "$GITHUB_OUTPUT"
          echo "tag=$(nix eval --raw .#packages.x86_64-linux.docker.imageTag)" >> "$GITHUB_OUTPUT"

      - name: Start docker image
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker load < '${{ steps.image.outputs.path }}'
          docker run --detach --init --name listogether --publish 3000:8789 \
            --env ID_SIGNING_KEY="$(cat server/id_signing_key.txt)" "listogether:$TAG"
          curl --fail --silent --show-error --output /dev/null \
            --retry 10 --retry-connrefused --retry-delay 1 http://localhost:3000/

      - name: Tests
        run: pnpm -r test

      - name: Server logs
        if: failure()
        run: docker logs listogether

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: e2e/test-results
          if-no-files-found: ignore

      - name: Push docker image
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "listogether:$TAG" "$IMAGE:$TAG"
          docker tag "listogether:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest docker image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
